<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZoThawnthu — admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html" class="logo"><span class="dot"></span>ZoThawnthu</a>
  </nav>

  <div class="admin-panel" id="loginPanel" style="display:none;">
    <h1>sign in</h1>
    <p class="sub">this is your private posting page. only you should have this link and these credentials.</p>
    <div class="field">
      <label>email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label>password</label>
      <input type="password" id="loginPassword" placeholder="your password" />
    </div>
    <button class="submit-btn" id="loginBtn">sign in</button>
    <p class="status-msg" id="loginStatus"></p>
  </div>

  <div class="admin-panel" id="postPanel" style="display:none;">
    <h1>post a story</h1>
    <p class="sub">signed in as <span id="whoAmI"></span></p>

    <div class="field">
      <label>title</label>
      <input type="text" id="title" placeholder="story title" maxlength="150" />
    </div>
    <div class="field">
      <label>category</label>
      <input type="text" id="category" list="categoryOptions" placeholder="e.g. Horror, Romance, Fantasy" maxlength="40" />
      <datalist id="categoryOptions"></datalist>
    </div>
    <div class="field">
      <label>story</label>
      <textarea id="content" rows="12" placeholder="write your story here..."></textarea>
    </div>

    <button class="submit-btn" id="postBtn">publish</button>
    <p class="status-msg" id="statusMsg"></p>
    <a href="#" class="signout-link" id="signOutLink">sign out</a>
  </div>

  <div class="admin-panel" id="managePanel" style="display:none;">
    <h1>your stories</h1>
    <p class="sub">tap delete to remove a story permanently, along with its comments and likes.</p>
    <div id="storyList"></div>
  </div>

  <script src="config.js"></script>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    window.supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.dispatchEvent(new Event('supabase-ready'));
  </script>
  <script>
    window.addEventListener('supabase-ready', init);

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showPostPanel(session.user.email);
      } else {
        document.getElementById('loginPanel').style.display = 'block';
      }
    }

    function showPostPanel(email) {
      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('postPanel').style.display = 'block';
      document.getElementById('managePanel').style.display = 'block';
      document.getElementById('whoAmI').textContent = email;
      loadCategoryOptions();
      loadStoryList();
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const status = document.getElementById('loginStatus');
      status.style.display = 'none';

      if (!email || !password) {
        status.textContent = 'enter both email and password';
        status.className = 'status-msg err';
        status.style.display = 'block';
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        status.textContent = error.message;
        status.className = 'status-msg err';
        status.style.display = 'block';
        return;
      }
      showPostPanel(data.user.email);
    });

    document.getElementById('signOutLink').addEventListener('click', async (e) => {
      e.preventDefault();
      await supabase.auth.signOut();
      location.reload();
    });

    async function loadCategoryOptions() {
      const { data } = await supabase.from('stories').select('category');
      const categories = [...new Set((data || []).map(s => s.category))];
      document.getElementById('categoryOptions').innerHTML =
        categories.map(c => `<option value="${c.replace(/"/g, '')}"></option>`).join('');
    }

    document.getElementById('postBtn').addEventListener('click', async () => {
      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value.trim();
      const content = document.getElementById('content').value.trim();
      const status = document.getElementById('statusMsg');
      const btn = document.getElementById('postBtn');

      status.style.display = 'none';

      if (!title) return showStatus('enter a title', 'err');
      if (!category) return showStatus('enter a category', 'err');
      if (!content) return showStatus('write the story first', 'err');

      btn.disabled = true;

      const { data: row, error } = await supabase
        .from('stories')
        .insert({ title, category, content })
        .select()
        .single();

      btn.disabled = false;

      if (error) {
        return showStatus(error.message, 'err');
      }

      showStatus('published — redirecting…', 'ok');
      setTimeout(() => location.href = 'story.html?id=' + row.id, 800);

      function showStatus(msg, type) {
        status.textContent = msg;
        status.className = 'status-msg ' + type;
        status.style.display = 'block';
      }
    });

    async function loadStoryList() {
      const list = document.getElementById('storyList');
      const { data: stories, error } = await supabase
        .from('stories')
        .select('id, title, category, created_at')
        .order('created_at', { ascending: false });

      if (error || !stories || stories.length === 0) {
        list.innerHTML = '<p style="color:var(--text-dim); font-size:14px;">no stories posted yet</p>';
        return;
      }

      list.innerHTML = stories.map(s => `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);">
          <span style="font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.title.replace(/</g, '&lt;')} <span style="color:var(--text-dim); font-size:12px;">(${s.category.replace(/</g, '&lt;')})</span></span>
          <button class="delete-btn" data-id="${s.id}" data-title="${s.title.replace(/"/g, '')}">delete</button>
        </div>
      `).join('');

      list.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete "' + btn.dataset.title + '"? This cannot be undone.')) return;
          btn.disabled = true;
          btn.textContent = 'deleting…';

          const { error: delError } = await supabase.from('stories').delete().eq('id', btn.dataset.id);

          if (delError) {
            alert('Could not delete: ' + delError.message);
            btn.disabled = false;
            btn.textContent = 'delete';
            return;
          }
          loadStoryList();
        });
      });
    }
  </script>
</body>
</html>

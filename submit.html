<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZoThawnthu — submit a story</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html" class="logo"><span class="dot"></span>ZoThawnthu</a>
  </nav>

  <div class="admin-panel" id="formPanel">
    <h1>submit a story</h1>
    <p class="sub">your story will be reviewed before it shows up on the site. no account needed.</p>

    <div class="field">
      <label>your name (optional)</label>
      <input type="text" id="authorName" placeholder="how should we credit you?" maxlength="60" />
    </div>
    <div class="field">
      <label>title</label>
      <input type="text" id="title" placeholder="story title" maxlength="150" />
    </div>
    <div class="field">
      <label>category</label>
      <input type="text" id="category" placeholder="e.g. Horror, Romance, Fantasy" maxlength="40" />
    </div>
    <div class="field">
      <label>story</label>
      <textarea id="content" rows="12" placeholder="write your story here..."></textarea>
    </div>

    <button class="submit-btn" id="submitBtn">submit for review</button>
    <p class="status-msg" id="statusMsg"></p>
  </div>

  <div class="admin-panel" id="successPanel" style="display:none;">
    <h1>thanks!</h1>
    <p class="sub">your story has been submitted and is waiting for approval. it'll appear on the site once reviewed.</p>
    <a href="index.html" class="submit-btn" style="display:block; text-align:center; text-decoration:none;">back to stories</a>
  </div>

  <script src="config.js"></script>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    window.supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.dispatchEvent(new Event('supabase-ready'));
  </script>

    window.addEventListener('supabase-ready', () => { ready = true; });
